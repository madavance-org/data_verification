name: Test temporaire — Clean Cooking Suivi post distribution (branche)

# Workflow de développement : lancé au push de la branche clean-cooking-suivi, en mode DRY_RUN
# (aucun accès SharePoint, aucun email). À supprimer avant la fusion dans main.
on:
  push:
    branches: [clean-cooking-suivi]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Suivi post distribution (DRY_RUN)
        env:
          DRY_RUN: "true"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.verify_suivi_post_distribution
