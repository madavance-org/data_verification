name: Inspection ponctuelle — Datagrids Clean Cooking

on:
  push:
    branches: [clean-cooking-inspection]
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lister les colonnes des datagrids
        env:
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: |
          python -m clean_cooking.inspect_datagrids > /dev/null
          python -m clean_cooking.profile_inscription
