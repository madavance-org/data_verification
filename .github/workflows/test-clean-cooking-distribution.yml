name: Test temporaire — Clean Cooking Distribution (branche)

# Workflow de développement : lancé au push de la branche clean-cooking-distribution, en mode
# DRY_RUN (aucun accès SharePoint, aucun email). À supprimer avant la fusion dans main.
on:
  push:
    branches: [clean-cooking-distribution]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Profil du datagrid Distribution
        continue-on-error: true
        env:
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.profile_distribution

      - name: Inscription (DRY_RUN, contrôle de la refactorisation)
        continue-on-error: true
        env:
          DRY_RUN: "true"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.verify_inscription

      - name: Distribution (DRY_RUN)
        continue-on-error: true
        env:
          DRY_RUN: "true"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.verify_distribution
