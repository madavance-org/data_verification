name: Essai temporaire — Photos Première réhabilitation (branche)

# Workflow de développement : lancé au push de la branche photos-premiere-rehabilitation.
# ESSAI RÉEL limité à 20 photos (MAX_PHOTOS). Branche et fichier à supprimer après l'essai.
on:
  push:
    branches: [photos-premiere-rehabilitation]

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Archivage de 20 photos (essai réel)
        env:
          MAX_PHOTOS: "20"
          MAX_RUNTIME_MINUTES: "20"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK_PREMIERE_REHABILITATION_PHOTOS: ${{ secrets.SHAREPOINT_FOLDER_LINK_PREMIERE_REHABILITATION_PHOTOS }}
        run: python -m clean_water.premiere_rehabilitation.extract_photos
