name: Archivage des photos — Clean Water Première réhabilitation

on:
  schedule:
    # Une fois par mois : le 5 à 03:00 UTC. Le script est incrémental (registre photos_archivees.json
    # dans le dossier photos de SharePoint) : il n'archive que les nouvelles photos.
    - cron: "0 3 5 * *"
  # Lancement manuel : utile pour terminer le premier archivage complet (~22 000 photos), qui peut
  # demander plusieurs passages de 5 h, chacun reprenant là où le précédent s'est arrêté.
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Archiver les photos de la Première réhabilitation
        env:
          MAX_RUNTIME_MINUTES: "320"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK_PREMIERE_REHABILITATION_PHOTOS: ${{ secrets.SHAREPOINT_FOLDER_LINK_PREMIERE_REHABILITATION_PHOTOS }}
        run: python -m clean_water.premiere_rehabilitation.extract_photos
