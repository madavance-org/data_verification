name: Vérification de données — Carnet de bord

on:
  schedule:
    # Chaque lundi à 07:00 UTC (décalé de 30 min par rapport à verify.yml, pour éviter un
    # export mWater concurrent avec la vérification Appel maintenance préventive)
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification
        env:
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK: ${{ secrets.SHAREPOINT_FOLDER_LINK }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python verify_carnet_de_bord.py
