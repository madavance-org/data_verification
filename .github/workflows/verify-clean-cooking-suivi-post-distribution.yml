name: Vérification de données — Clean Cooking Suivi post distribution

on:
  schedule:
    # Chaque lundi à 11:00 UTC (après l'Inscription à 09:00 et la Distribution à 10:00 : ce script
    # télécharge aussi le datagrid Distribution, on évite des exports mWater concurrents)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification
        env:
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK: ${{ secrets.SHAREPOINT_FOLDER_LINK }}
          SHAREPOINT_FOLDER_LINK_SUIVI_POST_DISTRIBUTION: ${{ secrets.SHAREPOINT_FOLDER_LINK_SUIVI_POST_DISTRIBUTION }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -m clean_cooking.suivi_post_distribution.verify_suivi_post_distribution
