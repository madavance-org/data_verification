name: Vérification de données — Clean Cooking Inscription

on:
  # Phase de test : lancé à chaque push de cette branche, en mode DRY_RUN (aucun accès
  # SharePoint, aucun email). Pour la mise en production : passer DRY_RUN à "false", ajouter un
  # cron et retirer le déclencheur push.
  push:
    branches: [clean-cooking-inspection]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification
        env:
          DRY_RUN: "true"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK: ${{ secrets.SHAREPOINT_FOLDER_LINK }}
          SHAREPOINT_FOLDER_LINK_INSCRIPTION: ${{ secrets.SHAREPOINT_FOLDER_LINK_INSCRIPTION }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -m clean_cooking.verify_inscription
