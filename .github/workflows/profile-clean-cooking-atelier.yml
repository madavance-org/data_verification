name: Profil temporaire — Clean Cooking Atelier de réparation (branche)

# Workflow de développement : lancé au push de la branche clean-cooking-atelier. Lecture seule,
# n'affiche que des comptages et des masques. À supprimer avant la fusion dans main.
on:
  push:
    branches: [clean-cooking-atelier]

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Profil du datagrid Atelier de réparation
        env:
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.profile_atelier
