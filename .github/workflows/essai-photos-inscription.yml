name: Essai temporaire — Photos Clean Cooking Inscription (branche)

# Workflow de développement : lancé au push de la branche photos-inscription, en SIMULATION (DRY_RUN) :
# rien n'est téléchargé ni déposé. Branche et fichier à supprimer après l'essai.
on:
  push:
    branches: [photos-inscription]

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Simulation de l'archivage des photos (DRY_RUN)
        env:
          DRY_RUN: "true"
          MWATER_USERNAME: ${{ secrets.MWATER_USERNAME }}
          MWATER_PASSWORD: ${{ secrets.MWATER_PASSWORD }}
        run: python -m clean_cooking.inscription.extract_photos
